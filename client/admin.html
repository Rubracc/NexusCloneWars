<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Republic at War — Admin</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060810;--surf:rgba(9,13,26,.96);--glass:rgba(255,255,255,.04);--gb:rgba(255,255,255,.08);
  --rep:#2196f3;--sep:#e53935;--gold:#ffb300;--ok:#43a047;--danger:#e53935;
  --t1:#e8edf4;--t2:#8fa3b8;--t3:#3d5466;--b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.04);
  --r:4px;--r2:8px
}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--t1);overflow:hidden;width:100vw;height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px}
#game-wrap canvas{position:fixed;top:0;left:0;z-index:1}

/* AUTH SCREEN */
#auth-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#auth-screen h1{font-family:'Cinzel Decorative',serif;font-size:1.4rem;color:var(--gold);letter-spacing:3px}
#auth-screen input{padding:10px 14px;background:rgba(0,0,0,.5);border:1px solid var(--b1);color:var(--t1);font-family:'Rajdhani';font-size:.9rem;border-radius:var(--r);width:260px;outline:none}
#auth-screen input:focus{border-color:var(--rep)}
#auth-btn{padding:10px 28px;background:var(--rep);border:none;color:#fff;font-family:'Rajdhani';font-size:.8rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:var(--r)}
#auth-err{color:#ef9a9a;font-size:.7rem}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;height:50px;background:linear-gradient(180deg,rgba(6,8,16,.98),rgba(6,8,16,.82));border-bottom:1px solid var(--b1);display:flex;align-items:center;z-index:100;backdrop-filter:blur(12px)}
#hdr-brand{display:flex;align-items:center;gap:9px;padding:0 16px;border-right:1px solid var(--b1);height:100%}
.fcrest{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:.9rem;overflow:hidden;box-shadow:0 0 10px rgba(255,179,0,.4);background:rgba(0,0,0,.4)}
#hdr-title{font-family:'Cinzel Decorative',serif;font-size:.58rem;color:var(--gold);letter-spacing:2px}
#hdr-res{display:flex;align-items:center;flex:1;padding:0 8px}
.hres{display:flex;align-items:center;gap:6px;padding:0 10px;height:50px;border-right:1px solid var(--b2)}
.hres-val{font-family:'JetBrains Mono';font-size:.76rem;font-weight:700;color:var(--gold)}
.hres-val.b{color:var(--rep)}.hres-val.r{color:var(--sep)}
.hres-lbl{font-size:.42rem;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px}
.hres-sub{font-size:.42rem;color:var(--ok);margin-top:1px}
#hdr-acts{display:flex;align-items:center;gap:5px;padding:0 10px;border-left:1px solid var(--b1)}
.hbtn{display:flex;align-items:center;gap:4px;padding:5px 9px;height:30px;background:var(--glass);border:1px solid var(--gb);color:var(--t1);cursor:pointer;font-family:'Rajdhani';font-size:.58rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border-radius:var(--r);transition:all .15s}
.hbtn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.hbtn.gold{border-color:rgba(255,179,0,.3);color:var(--gold)}.hbtn.gold:hover{background:rgba(255,179,0,.1)}
.hbtn.blue{border-color:rgba(33,150,243,.3);color:var(--rep)}.hbtn.blue:hover{background:var(--rep-dim,rgba(33,150,243,.1))}
.hbtn.ok{border-color:rgba(67,160,71,.3);color:var(--ok)}.hbtn.ok:hover{background:rgba(67,160,71,.1)}
.hbtn.danger{border-color:rgba(229,57,53,.3);color:var(--danger)}.hbtn.danger:hover{background:rgba(229,57,53,.1)}
#conn-dot{width:8px;height:8px;border-radius:50%;background:#607d8b;flex-shrink:0;transition:background .3s}
#conn-dot.on{background:var(--ok)}.conn-dot.err{background:var(--danger)}

/* TOOL BAR */
#toolbar{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:90;background:var(--surf);border:1px solid var(--b1);border-radius:var(--r2);padding:5px 8px;backdrop-filter:blur(10px)}
.tbtn{padding:5px 10px;background:var(--glass);border:1px solid var(--b1);color:var(--t2);font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;border-radius:var(--r);transition:all .15s;font-family:'Rajdhani'}
.tbtn:hover{border-color:var(--gold);color:var(--gold);background:rgba(255,179,0,.1)}
.tbtn.on{border-color:var(--gold);color:var(--gold);background:rgba(255,179,0,.12)}

/* SIDE PANEL */
#panel{position:fixed;top:50px;right:0;width:340px;height:calc(100vh - 50px);background:var(--surf);border-left:1px solid var(--b1);display:flex;flex-direction:column;z-index:80;overflow:hidden}
#panel-tabs{display:flex;border-bottom:1px solid var(--b1);flex-shrink:0}
.ptab{flex:1;padding:8px 4px;background:none;border:none;color:var(--t3);font-family:'Rajdhani';font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;transition:all .15s;border-bottom:2px solid transparent}
.ptab:hover{color:var(--t1)}.ptab.on{color:var(--gold);border-bottom-color:var(--gold)}
#panel-body{flex:1;overflow-y:auto;overflow-x:hidden}
.ptc{display:none;padding:10px}.ptc.on{display:block}

/* PLANET PANEL */
#planet-preview{height:130px;background:linear-gradient(180deg,#111827,#0b1120);display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--b1);flex-shrink:0}
#prv-sphere{width:82px;height:82px;border-radius:50%;box-shadow:inset -16px -12px 32px rgba(0,0,0,.85)}
#prv-info{position:absolute;bottom:8px;left:12px;right:12px}
#prv-name{font-family:'Cinzel Decorative',serif;font-size:.78rem;color:var(--gold)}
#prv-sub{font-size:.56rem;color:var(--t2);margin-top:2px}

/* SECTIONS */
.sec{padding:8px 10px;border-bottom:1px solid var(--b2)}
.sec-t{font-size:.46rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.cnt{font-family:'JetBrains Mono';font-size:.46rem;color:var(--gold)}
.fslot{background:var(--glass);border:1px solid var(--b1);padding:6px 8px;margin-bottom:3px;border-radius:var(--r);cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:flex-start}
.fslot:hover{border-color:var(--rep);background:rgba(33,150,243,.1)}
.fslot.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(255,179,0,.3)}
.fslot.enemy{border-color:rgba(229,57,53,.2);background:rgba(229,57,53,.05)}
.fsname{font-size:.6rem;color:var(--gold);font-weight:600}
.fsfac{font-size:.44rem}
.fsunits{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.utag{font-size:.44rem;padding:1px 4px;border-radius:3px;background:rgba(33,150,243,.15);border:1px solid rgba(33,150,243,.3);color:var(--rep)}
.empty-slot{color:var(--t3);font-size:.54rem;font-style:italic}
.bslot{background:var(--glass);border:1px solid var(--b1);padding:5px 8px;margin-bottom:3px;border-radius:var(--r);display:flex;align-items:center;gap:7px}
.bslot.empty{color:var(--t3);font-size:.52rem;font-style:italic}
.bname{font-size:.58rem}.bbonus{font-size:.44rem;color:var(--gold)}
.citem{background:var(--glass);border:1px solid rgba(255,179,0,.2);padding:6px 8px;margin-bottom:3px;border-radius:var(--r)}
.cbar{width:100%;height:3px;background:var(--b1);border-radius:2px;overflow:hidden;margin-top:3px}
.cfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--rep))}
.ceta{font-size:.44rem;color:var(--t3);font-family:'JetBrains Mono';margin-top:2px}

/* FORMS */
.fg{margin-bottom:6px}
.fl{display:block;font-size:.46rem;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:2px}
.fi,.fs{width:100%;padding:6px 8px;background:rgba(0,0,0,.4);border:1px solid var(--b1);color:var(--t1);font-family:'Rajdhani';font-size:.68rem;border-radius:var(--r);outline:none;transition:border-color .15s}
.fi:focus,.fs:focus{border-color:var(--rep)}.fs option{background:#0d1117}
.fr{display:flex;gap:6px}.fr .fg{flex:1}
.bgrid{display:flex;flex-wrap:wrap;gap:4px}
.bopt{padding:4px 7px;border-radius:var(--r);border:1px solid var(--b1);background:var(--glass);color:var(--t1);cursor:pointer;font-size:.52rem;transition:all .15s;font-family:'Rajdhani'}
.bopt:hover:not(:disabled){border-color:var(--rep);background:rgba(33,150,243,.1)}
.bopt:disabled{opacity:.35;cursor:not-allowed}
.bc{color:var(--gold);font-family:'JetBrains Mono';font-size:.44rem}

/* BUTTONS */
.btn{padding:5px 11px;border:none;font-family:'Rajdhani';font-size:.54rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:var(--r);transition:all .15s}
.btn-p{background:var(--rep);color:#fff}.btn-p:hover{background:#42a5f5}
.btn-s{background:var(--ok);color:#fff}.btn-s:hover{background:#4caf50}
.btn-d{background:var(--danger);color:#fff}.btn-d:hover{background:#ef5350}
.btn-n{background:var(--glass);border:1px solid var(--b1);color:var(--t1)}.btn-n:hover{background:rgba(255,255,255,.1)}
.btn-g{background:rgba(255,179,0,.12);border:1px solid var(--gold);color:var(--gold)}.btn-g:hover{background:rgba(255,179,0,.22)}
.btn-sm{padding:3px 7px;font-size:.46rem}

/* ACTIONS */
#panel-actions{padding:8px 10px;border-top:1px solid var(--b1);flex-shrink:0}
.actbtn{width:100%;padding:8px;background:var(--glass);border:1px solid var(--b1);color:var(--t1);font-family:'Rajdhani';font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;cursor:pointer;border-radius:var(--r);transition:all .15s;margin-bottom:4px}
.actbtn:last-child{margin-bottom:0}
.actbtn:hover:not(:disabled){border-color:var(--rep);background:rgba(33,150,243,.1)}
.actbtn:disabled{opacity:.35;cursor:not-allowed}
.actbtn.primary{border-color:var(--rep);background:rgba(33,150,243,.12)}

/* EVENT LOG */
#evlog{position:fixed;top:60px;left:0;width:260px;max-height:220px;background:var(--surf);border:1px solid var(--b1);border-radius:0 0 var(--r2) 0;z-index:85;overflow:hidden}
#evlog-hdr{padding:4px 9px;background:var(--glass);border-bottom:1px solid var(--b1);font-size:.44rem;color:var(--t3);text-transform:uppercase;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}
#evlog-list{max-height:190px;overflow-y:auto}
.ev{padding:4px 9px;border-bottom:1px solid var(--b2);font-size:.5rem;line-height:1.4}
.ev:last-child{border-bottom:none}
.ev.battle{color:#ef9a9a}.ev.conquest{color:#a5d6a7}.ev.build{color:var(--gold)}.ev.move{color:var(--rep)}.ev.announce{color:#fff;font-weight:700}

/* HUD */
#minimap{position:fixed;bottom:16px;left:16px;width:150px;height:100px;background:var(--surf);border:1px solid var(--b1);border-radius:var(--r2);z-index:80;overflow:hidden;cursor:pointer}
#mmc{position:relative;width:100%;height:100%}
.mp{position:absolute;width:5px;height:5px;border-radius:50%;transform:translate(-50%,-50%)}
#mvp{position:absolute;border:1px solid var(--gold);background:rgba(255,179,0,.08);pointer-events:none}
#coords{position:fixed;bottom:124px;left:16px;padding:4px 8px;background:var(--surf);border:1px solid var(--b1);font-family:'JetBrains Mono';font-size:.5rem;color:var(--t3);border-radius:var(--r)}
#zctrl{position:fixed;bottom:16px;left:180px;display:flex;flex-direction:column;gap:4px}
.zbtn{width:32px;height:32px;background:var(--surf);border:1px solid var(--b1);color:var(--t1);font-size:1rem;cursor:pointer;border-radius:var(--r);display:flex;align-items:center;justify-content:center;transition:all .15s}
.zbtn:hover{border-color:var(--rep);color:var(--rep);background:rgba(33,150,243,.1)}
.zlv{text-align:center;font-family:'JetBrains Mono';font-size:.5rem;color:var(--t3);padding:3px;background:var(--surf);border:1px solid var(--b1);border-radius:var(--r)}

/* TOAST */
#toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:var(--r);font-family:'Rajdhani';font-size:.68rem;font-weight:600;letter-spacing:1.5px;z-index:2000;display:none;white-space:nowrap}
#toast.on{display:block;animation:tst 2.6s ease forwards}
#toast.ok{background:rgba(43,122,50,.95);border:1px solid var(--ok);color:#a5d6a7}
#toast.err{background:rgba(122,20,20,.95);border:1px solid var(--danger);color:#ef9a9a}
#toast.inf{background:rgba(13,30,65,.97);border:1px solid var(--rep);color:#90caf9}
@keyframes tst{0%{opacity:0;transform:translateX(-50%) translateY(8px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--surf);border:1px solid var(--b1);border-radius:var(--r2);min-width:300px;max-width:450px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.mhdr{padding:13px 16px;border-bottom:1px solid var(--b1);font-family:'Cinzel Decorative',serif;font-size:.7rem;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.mclose{background:none;border:none;color:var(--t3);cursor:pointer;font-size:.9rem;border-radius:var(--r);padding:2px 5px}
.mclose:hover{color:var(--danger)}
.mbody{padding:14px}.mfoot{padding:10px 14px;border-top:1px solid var(--b1);display:flex;justify-content:flex-end;gap:6px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div style="font-size:2rem;margin-bottom:8px">🚀</div>
  <h1>Republic at War</h1>
  <div style="font-size:.62rem;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px">Panneau Administrateur</div>
  <input type="password" id="auth-input" placeholder="Mot de passe admin" autofocus>
  <button id="auth-btn">Connexion</button>
  <div id="auth-err"></div>
</div>

<!-- MAIN UI (hidden until auth) -->
<div id="main-ui" style="display:none">
  <div id="game-wrap" style="position:fixed;top:0;left:0;width:calc(100vw - 340px);height:100vh;z-index:1"></div>

  <!-- HEADER -->
  <header id="hdr">
    <div id="hdr-brand">
      <div class="fcrest" id="fcrest">⚙</div>
      <div><div id="hdr-title">ADMIN — REPUBLIC AT WAR</div></div>
    </div>
    <div id="hdr-res">
      <div class="hres"><span style="font-size:.9rem">💰</span><div><div class="hres-val" id="r-rep">50,000</div><div class="hres-lbl">République</div><div class="hres-sub" id="r-rep-inc">+0/s</div></div></div>
      <div class="hres"><span style="font-size:.9rem">💰</span><div><div class="hres-val r" id="r-sep">30,000</div><div class="hres-lbl">Séparatistes</div><div class="hres-sub" id="r-sep-inc">+0/s</div></div></div>
      <div class="hres"><span style="font-size:.9rem">🌍</span><div><div class="hres-val b" id="r-pla">0/0</div><div class="hres-lbl">Planètes</div></div></div>
      <div class="hres"><span style="font-size:.9rem">🚀</span><div><div class="hres-val" id="r-tr">0</div><div class="hres-lbl">En transit</div></div></div>
      <div class="hres"><span style="font-size:.9rem">🔨</span><div><div class="hres-val" id="r-con">0</div><div class="hres-lbl">Constructions</div></div></div>
    </div>
    <div id="hdr-acts">
      <div id="conn-dot"></div>
      <button class="hbtn ok" onclick="A.save()">💾 Save</button>
      <button class="hbtn danger" onclick="A.reset()">⚠️ Reset</button>
      <button class="hbtn blue" onclick="A.announce()">📢 Announce</button>
    </div>
  </header>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <button class="tbtn" id="t-select" onclick="A.setTool('select')">🖱️ Select</button>
    <button class="tbtn" id="t-route" onclick="A.setTool('route')">🔗 Route</button>
    <button class="tbtn" id="t-planet" onclick="A.setTool('planet')">🌍 Planète</button>
    <span style="width:1px;background:var(--b1);margin:0 2px"></span>
    <button class="tbtn" onclick="A.toggleAI()" id="t-ai">🤖 IA: ON</button>
    <button class="tbtn" onclick="A.toggleCombat()" id="t-combat">⚔️ Combat: ON</button>
  </div>

  <!-- SIDE PANEL -->
  <div id="panel">
    <!-- Planet view -->
    <div id="planet-view" style="display:none;flex-direction:column;height:100%">
      <div id="planet-preview">
        <div id="prv-sphere"></div>
        <div id="prv-info">
          <div id="prv-name">PLANÈTE</div>
          <div id="prv-sub"></div>
        </div>
        <button style="position:absolute;top:8px;right:8px;background:none;border:1px solid var(--b1);color:var(--t3);width:24px;height:24px;cursor:pointer;border-radius:var(--r);font-size:.8rem" onclick="A.closePanel()">✕</button>
      </div>
      <div id="panel-tabs">
        <button class="ptab on" data-tab="overview" onclick="A.pTab('overview')">Info</button>
        <button class="ptab" data-tab="military" onclick="A.pTab('military')">Militaire</button>
        <button class="ptab" data-tab="structures" onclick="A.pTab('structures')">Structures</button>
        <button class="ptab" data-tab="build" onclick="A.pTab('build')">Construire</button>
        <button class="ptab" data-tab="edit" onclick="A.pTab('edit')">Éditer</button>
      </div>
      <div id="panel-body">
        <div class="ptc on" id="tc-overview"></div>
        <div class="ptc" id="tc-military"></div>
        <div class="ptc" id="tc-structures"></div>
        <div class="ptc" id="tc-build"></div>
        <div class="ptc" id="tc-edit"></div>
      </div>
      <div id="panel-actions">
        <button class="actbtn primary" id="move-btn" onclick="A.startMove()" disabled>⚡ Déplacer la flotte sélectionnée</button>
      </div>
    </div>

    <!-- Default: event log -->
    <div id="default-view" style="height:100%;display:flex;flex-direction:column">
      <div style="padding:10px;border-bottom:1px solid var(--b1);font-size:.5rem;color:var(--t3);text-transform:uppercase;letter-spacing:2px">Journal des événements</div>
      <div id="side-evlog" style="flex:1;overflow-y:auto;padding:4px 0"></div>
    </div>
  </div>

  <!-- BOTTOM HUD -->
  <div id="minimap"><div id="mmc"><div id="mvp"></div></div></div>
  <div id="coords">X: 0 | Y: 0</div>
  <div id="zctrl">
    <button class="zbtn" onclick="A.zi()">+</button>
    <div class="zlv" id="zlv">100%</div>
    <button class="zbtn" onclick="A.zo()">−</button>
    <button class="zbtn" onclick="A.rv()" style="font-size:.62rem">⌂</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

const socket = io();
let G = null; // Game state
let scene = null; // Phaser scene ref

// ─── AUTH ─────────────────────────────────────────────────────────────────────
const authInput = document.getElementById('auth-input');
const authBtn   = document.getElementById('auth-btn');
const authErr   = document.getElementById('auth-err');

function doAuth() {
  const pw = authInput.value.trim();
  if (!pw) return;
  socket.emit('auth', { password: pw }, (res) => {
    if (res.ok) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-ui').style.display = 'block';
      initPhaser();
    } else {
      authErr.textContent = res.error || 'Erreur';
    }
  });
}
authBtn.onclick = doAuth;
authInput.onkeydown = e => { if (e.key === 'Enter') doAuth(); };

// ─── SOCKET EVENTS ────────────────────────────────────────────────────────────
socket.on('connect', () => {
  document.getElementById('conn-dot').classList.add('on');
});
socket.on('disconnect', () => {
  document.getElementById('conn-dot').className = 'conn-dot err';
  toast('❌ Déconnecté du serveur', 'err');
});
socket.on('state', (s) => {
  G = s;
  if (scene) scene.onStateUpdate();
  updateHUD();
});
socket.on('state_delta', (delta) => {
  if (!G) return;
  Object.assign(G, delta);
  if (scene) scene.onStateUpdate();
  updateHUD();
  if (A.selectedPlanet) A.refreshPanel();
});
socket.on('fleets_tick', ({ fleets, ts }) => {
  if (!G) return;
  G.fleets = fleets;
  if (scene) scene.updateFleets(ts);
});
socket.on('credits', (credits) => {
  if (!G) return;
  G.credits = credits;
  updateHUD();
});
socket.on('combat_result', ({ result, planet }) => {
  const msg = result.won
    ? result.captured
      ? `🏆 ${planet.name} CONQUISE par ${result.attacker}!`
      : `⚔️ Victoire à ${planet.name}`
    : `💀 Flotte détruite à ${planet.name}`;
  toast(msg, result.won ? 'ok' : 'err');
});
socket.on('announce', ({ msg }) => {
  toast('📢 ' + msg, 'inf');
});

// ─── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD() {
  if (!G) return;
  const creds = G.credits || {};
  document.getElementById('r-rep').textContent = fmt(creds.republic || 0);
  document.getElementById('r-sep').textContent = fmt(creds.separatist || 0);
  const total = Object.keys(G.planets || {}).length;
  const rep   = Object.values(G.planets || {}).filter(p => p.owner === 'republic').length;
  const sep   = Object.values(G.planets || {}).filter(p => p.owner === 'separatist').length;
  document.getElementById('r-pla').textContent = `R:${rep} S:${sep}/${total}`;
  document.getElementById('r-tr').textContent  = Object.keys(G.fleets || {}).length;
  document.getElementById('r-con').textContent = (G.constructionQueue || []).length;

  // Side event log
  const log = document.getElementById('side-evlog');
  if (log && G.eventLog) {
    log.innerHTML = G.eventLog.slice(0, 30).map(e =>
      `<div class="ev ${e.type}" style="padding:5px 10px;border-bottom:1px solid var(--b2);font-size:.5rem;line-height:1.4">${e.msg}</div>`
    ).join('');
  }
}

const fmt = n => Math.floor(n).toLocaleString('fr-FR');
const ic  = (o, s=18) => o?.image
  ? `<img src="${o.image}" style="width:${s}px;height:${s}px;border-radius:3px;object-fit:cover">`
  : `<span style="font-size:${Math.round(s*.75)}px;line-height:1">${o?.icon || '?'}</span>`;

function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = type;
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2700);
}

// ─── ADMIN CONTROLLER ─────────────────────────────────────────────────────────
const A = {
  tool: 'select',
  selectedPlanet: null,
  selectedFleet: null,
  selectedFleetDomain: null,
  hlStart: null,
  hlType: 'medium',
  isMoving: false,

  setTool(t) {
    this.tool = t;
    document.querySelectorAll('.tbtn[id^="t-"]').forEach(b => b.classList.remove('on'));
    document.getElementById('t-' + t)?.classList.add('on');
    if (t !== 'route') { this.hlStart = null; }
    if (t !== 'move') this.isMoving = false;
    if (scene) scene.updateCursor();
  },

  zi() { scene?.cameras.main.zoom = Math.min(3, scene.cameras.main.zoom + 0.15); scene?.updateMiniVP(); },
  zo() { scene?.cameras.main.zoom = Math.max(0.2, scene.cameras.main.zoom - 0.15); scene?.updateMiniVP(); },
  rv() { scene?.cameras.main.zoom = 1; scene?.cameras.main.centerOn(G.settings.mapW / 2, G.settings.mapH / 2); scene?.updateMiniVP(); },

  toggleAI() {
    const on = !G.settings.aiEnabled;
    socket.emit('set_settings', { aiEnabled: on });
    document.getElementById('t-ai').textContent = `🤖 IA: ${on ? 'ON' : 'OFF'}`;
    toast(`IA ${on ? 'activée' : 'désactivée'}`, 'inf');
  },

  toggleCombat() {
    const on = !G.settings.combatEnabled;
    socket.emit('set_settings', { combatEnabled: on });
    document.getElementById('t-combat').textContent = `⚔️ Combat: ${on ? 'ON' : 'OFF'}`;
    toast(`Combat ${on ? 'activé' : 'désactivé'}`, 'inf');
  },

  save() {
    socket.emit('save', {}, r => toast(r.ok ? '✓ Sauvegardé' : '❌ Erreur', r.ok ? 'ok' : 'err'));
  },

  reset() {
    if (!confirm('Réinitialiser toute la partie ?')) return;
    socket.emit('reset', {}, r => { if (r.ok) toast('✓ Réinitialisé', 'ok'); });
  },

  announce() {
    const msg = prompt('Message pour tous les joueurs :');
    if (msg?.trim()) socket.emit('announce', { msg }, r => toast(r.ok ? '📢 Envoyé' : '❌', r.ok ? 'inf' : 'err'));
  },

  // ── PLANET SELECTION ──────────────────────────────────────────────────────
  selectPlanet(id) {
    if (this.tool === 'route') {
      if (!this.hlStart) {
        this.hlStart = id;
        toast(`Départ: ${G.planets[id]?.name} — cliquez destination`, 'inf');
      } else if (this.hlStart !== id) {
        socket.emit('add_hyperlane', { from: this.hlStart, to: id, type: this.hlType }, r => {
          toast(r.ok ? `✓ Route créée` : `❌ ${r.error}`, r.ok ? 'ok' : 'err');
        });
        this.hlStart = null;
      }
      return;
    }
    if (this.isMoving) {
      this.confirmMove(id);
      return;
    }
    this.selectedPlanet = id;
    this.selectedFleet  = null;
    this.selectedFleetDomain = null;
    document.getElementById('planet-view').style.display = 'flex';
    document.getElementById('default-view').style.display = 'none';
    this.refreshPanel();
  },

  closePanel() {
    this.selectedPlanet = null;
    this.selectedFleet  = null;
    this.isMoving = false;
    document.getElementById('planet-view').style.display = 'none';
    document.getElementById('default-view').style.display = 'flex';
    if (scene) scene.onStateUpdate();
  },

  pTab(name) {
    document.querySelectorAll('.ptab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
    document.querySelectorAll('.ptc').forEach(c => c.classList.toggle('on', c.id === 'tc-' + name));
    this['render_' + name]?.();
  },

  refreshPanel() {
    const p = G.planets[this.selectedPlanet];
    if (!p) return;
    const f = G.factions[p.owner] || G.factions.neutral;
    // Update header
    const sp = document.getElementById('prv-sphere');
    sp.className = 'psp ' + p.type;
    if (p.image) sp.style.backgroundImage = `url(${p.image})`;

    document.getElementById('prv-sub').innerHTML = `${p.terrain||''} • <span style="color:${f.color}">${f.name}</span>`;

    const active = document.querySelector('.ptab.on')?.dataset.tab || 'overview';
    this['render_' + active]?.();
    document.getElementById('move-btn').disabled = !this.selectedFleet;
  },

  render_overview() {
    const p = G.planets[this.selectedPlanet];
    if (!p) return;
    const f = G.factions[p.owner] || G.factions.neutral;
    const sf = p.spaceFleets.filter(x => x).length;
    const gf = p.groundFleets.filter(x => x).length;
    const sb = p.spaceBuildings.filter(x => x).length;
    const gb = p.groundBuildings.filter(x => x).length;
    const cons = (G.constructionQueue || []).filter(c => c.planetId === p.id);
    const now = Date.now();

    document.getElementById('tc-overview').innerHTML = `
      <div class="sec">
        <div class="sec-t">Informations</div>
        <div style="font-size:.62rem;line-height:1.8">
          <div>🌍 Type: <span style="color:var(--gold)">${p.type}</span></div>
          <div>📍 Terrain: ${p.terrain||'—'}</div>

          <div>📐 Coordonnées: (${p.x}, ${p.y})</div>
          <div>⚔️ Militaire: 🚀${sf} flottes / ⚔️${gf} armées</div>
          <div>🏗️ Structures: 🛰️${sb} orbitales / 🏛️${gb} sol</div>
        </div>
      </div>
      ${cons.length ? `<div class="sec">
        <div class="sec-t">🔨 En construction <span class="cnt">${cons.length}</span></div>
        ${cons.map(c => {
          const item = c.type==='unit' ? G.unitTypes[c.unitTypeId] : G.buildingTypes[c.buildingTypeId];
          const pct = Math.min(100, Math.round((now-c.startTime)/(c.completionTime-c.startTime)*100));
          const rem = Math.max(0, c.completionTime-now);
          return `<div class="citem">
            <div style="display:flex;justify-content:space-between;align-items:center">

            </div>
            <div class="cbar"><div class="cfill" style="width:${pct}%"></div></div>
            <div class="ceta">${Math.round(rem/1000)}s restant</div>
          </div>`;

      </div>` : ''}`;
  },

  render_military() {
    const p = G.planets[this.selectedPlanet];
    if (!p) return;
    const rf = (arr, domain) => arr.map((fl, i) => {
      if (!fl) return `<div class="fslot empty"><div class="empty-slot">Slot ${i+1} — Vide</div></div>`;
      const ff = G.factions[fl.faction] || G.factions.neutral;
      const isE = fl.faction !== 'republic' && fl.faction !== 'separatist' ? false : fl.faction !== (G.settings.playerFaction || 'republic');
      let us = '';
      for (const uid in fl.units||{}) {

        const u = G.unitTypes[uid];
        if (u) us += `<span class="utag">${fl.units[uid]}×${u.name}</span>`;
      }
      const isSel = this.selectedFleet === fl.id;
      return `<div class="fslot ${isSel?'sel':''}" id="fs-${fl.id}" onclick="A.selFleet('${fl.id}','${domain}')" style="border-left:3px solid ${ff.color}">
        <div>
          <div class="fsname">${ic(fl,16)} ${fl.name}</div>
          <div class="fsunits">${us||'<span style="font-size:.44rem;color:var(--t3)">Aucune unité</span>'}</div>
        </div>
        <div style="font-size:.44rem;color:${ff.color};text-align:right">

        ${rf(p.groundFleets, 'ground')}
        <button class="btn btn-p btn-sm" style="margin-top:4px;width:100%" onclick="A.addFleet('${p.id}','ground')">+ Ajouter armée</button>
      </div>`;
  },

  render_structures() {
    const p = G.planets[this.selectedPlanet];
    if (!p) return;
    const rb = arr => arr.map((b, i) => {
      if (!b) return `<div class="bslot empty">Slot ${i+1} — Vide</div>`;
      const bt = G.buildingTypes[b.type];
      return `<div class="bslot"><span>${bt ? ic(bt,16) : '🏛️'}</span><div><div class="bname">${b.name||bt?.name||'?'}</div>${bt?`<div class="bbonus">${bt.bonus||''}</div>`:''}</div><button class="btn btn-d btn-sm" style="margin-left:auto" onclick="A.removeBuilding('${p.id}','${b.domain||'ground'}',${i})">✕</button></div>`;

    document.getElementById('tc-structures').innerHTML = `
      <div class="sec"><div class="sec-t">🛰️ Orbital <span class="cnt">${p.spaceBuildings.filter(x=>x).length}/${p.spaceBuildings.length}</span></div>${rb(p.spaceBuildings)}</div>
      <div class="sec"><div class="sec-t">🏛️ Sol <span class="cnt">${p.groundBuildings.filter(x=>x).length}/${p.groundBuildings.length}</span></div>${rb(p.groundBuildings)}</div>`;
  },

  render_build() {
    const p = G.planets[this.selectedPlanet];
    if (!p) return;
    const faction = p.owner !== 'neutral' ? p.owner : 'republic';
    const credits = G.credits[faction] || 0;

    const allSlots = [...p.spaceBuildings, ...p.groundBuildings];
    const units = Object.values(G.unitTypes).filter(u => u.faction === faction);
    const bldgs = Object.values(G.buildingTypes).filter(b => b.faction === faction);

    const ru = u => {
      const hasBldg = !u.req || allSlots.some(b => b?.type === u.req);
      const canAff  = credits >= u.cost;
      const ok = hasBldg && canAff;
      const tip = !hasBldg ? `Nécessite: ${G.buildingTypes[u.req]?.name||u.req}` : (!canAff ? 'Crédits insuffisants' : '');
      return `<button class="bopt" onclick="A.build('${p.id}','unit','${u.id}')" ${ok?'':'disabled'} title="${tip}">${ic(u,13)} ${u.name} <span class="bc">${fmt(u.cost)}cr</span></button>`;
    };
    const rb2 = b => {
      const already = allSlots.some(sl => sl?.type === b.id);
      const canAff  = credits >= b.cost;
      return `<button class="bopt" onclick="A.build('${p.id}','building','${b.id}')" ${(!canAff||already)?'disabled':''} title="${already?'Déjà construit':''}">${ic(b,13)} ${b.name} <span class="bc">${fmt(b.cost)}cr</span></button>`;
    };

  render_edit() {
    const p = G.planets[this.selectedPlanet];
    if (!p) return;
    const fOpts = Object.values(G.factions).map(f => `<option value="${f.id}" ${p.owner===f.id?'selected':''}>${f.name}</option>`).join('');

      <div class="sec">
        <div class="fg"><label class="fl">Nom</label><input class="fi" id="ed-name" value="${p.name}"></div>
        <div class="fr">
          <div class="fg"><label class="fl">Type</label><select class="fs" id="ed-type">${tOpts}</select></div>
          <div class="fg"><label class="fl">Faction</label><select class="fs" id="ed-owner">${fOpts}</select></div>
        </div>
        <div class="fg"><label class="fl">Terrain</label><input class="fi" id="ed-terrain" value="${p.terrain||''}"></div>
        <div class="fr">
          <div class="fg"><label class="fl">X</label><input class="fi" type="number" id="ed-x" value="${p.x}"></div>
          <div class="fg"><label class="fl">Y</label><input class="fi" type="number" id="ed-y" value="${p.y}"></div>
          <div class="fg"><label class="fl">Bonus</label><input class="fi" type="number" id="ed-bonus" value="${p.bonus||100}"></div>

        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn btn-s" style="flex:1" onclick="A.savePlanet()">✓ Sauvegarder</button>
          <button class="btn btn-d btn-sm" onclick="A.deletePlanet()">🗑️</button>
        </div>
      </div>`;
  },

  // ── ACTIONS ───────────────────────────────────────────────────────────────
  selFleet(id, domain) {
    this.selectedFleet = id;
    this.selectedFleetDomain = domain;
    this.render_military();
    document.getElementById('move-btn').disabled = false;
  },

  startMove() {
    if (!this.selectedFleet || !this.selectedPlanet) return;
    this.isMoving = true;
    toast('Cliquez sur la planète de destination', 'inf');
  },

  confirmMove(destId) {
    if (!this.isMoving || !this.selectedFleet || !this.selectedPlanet) return;
    socket.emit('move_fleet', {
      planetId: this.selectedPlanet,
      fleetId: this.selectedFleet,
      domain: this.selectedFleetDomain || 'space',
      destId
    }, r => {
      if (r.ok) {
        toast('🚀 Flotte en route!', 'ok');
        this.selectedFleet = null;
      } else {
        toast('❌ ' + r.error, 'err');
      }
    });
    this.isMoving = false;
  },

  build(pid, type, itemId, qty=1, free=false) {
    socket.emit('build', { planetId: pid, type, itemId, qty, free }, r => {
      toast(r.ok ? `🔨 Construction lancée!` : `❌ ${r.error}`, r.ok ? 'ok' : 'err');
      if (r.ok) this.refreshPanel();
    });
  },

  cancelConstruction(id) {
    socket.emit('cancel_construction', { id }, r => {
      toast(r.ok ? '✓ Annulé' : '❌', r.ok ? 'ok' : 'err');
    });
  },

  addFleet(pid, domain) {
    const f = G.factions[G.planets[pid]?.owner] || G.factions.republic;
    socket.emit('set_fleet', { planetId: pid, domain, slotIdx: A._freeSlot(pid, domain), fleet: {
      id: 'fl_' + Date.now(), name: 'Nouvelle Flotte', faction: G.planets[pid]?.owner || 'republic', units: {}
    }}, r => { toast(r.ok ? '✓ Flotte ajoutée' : '❌', r.ok ? 'ok' : 'err'); });
  },

  _freeSlot(pid, domain) {
    const p = G.planets[pid];
    const arr = domain === 'space' ? p.spaceFleets : p.groundFleets;
    const idx = arr.findIndex(x => !x);
    return idx !== -1 ? idx : arr.length;
  },

  removeFleet(pid, domain, slotIdx) {
    socket.emit('set_fleet', { planetId: pid, domain, slotIdx, fleet: null }, () => {});
  },

  removeBuilding(pid, domain, slotIdx) {
    const p = G.planets[pid];
    const arr = (domain === 'space' ? p.spaceBuildings : p.groundBuildings).slice();
    arr[slotIdx] = null;
    socket.emit('set_planet', {
      id: pid,
      ...(domain === 'space' ? { spaceBuildings: arr } : { groundBuildings: arr })
    }, () => {});
  },

  savePlanet() {
    const id = this.selectedPlanet;
    socket.emit('set_planet', {
      id,
      name: document.getElementById('ed-name')?.value || '',
      type: document.getElementById('ed-type')?.value || 'desert',
      owner: document.getElementById('ed-owner')?.value || 'neutral',
      terrain: document.getElementById('ed-terrain')?.value || '',
      x: parseInt(document.getElementById('ed-x')?.value) || 0,
      y: parseInt(document.getElementById('ed-y')?.value) || 0,
      bonus: parseInt(document.getElementById('ed-bonus')?.value) || 100,
    }, r => toast(r.ok ? '✓ Sauvegardé' : '❌ ' + r.error, r.ok ? 'ok' : 'err'));
  },

  deletePlanet() {
    if (!confirm(`Supprimer "${G.planets[this.selectedPlanet]?.name}" ?`)) return;
    socket.emit('delete_planet', { id: this.selectedPlanet }, r => {
      if (r.ok) { this.closePanel(); toast('✓ Supprimé', 'ok'); }
    });
  }
};

// ─── PHASER 3 SCENE ────────────────────────────────────────────────────────────
function initPhaser() {
  const W = window.innerWidth - 340;
  const H = window.innerHeight;

  const config = {
    type: Phaser.AUTO,
    width: W, height: H,
    parent: 'game-wrap',
    backgroundColor: '#060810',
    scene: { preload, create, update }
  };

  const game = new Phaser.Game(config);

  function preload() {}

  function create() {
    scene = this;
    this._planets    = {};
    this._hyperlanes = [];
    this._fleetObjs  = {};
    this._miniPlanets= [];

    this.cameras.main.setBounds(0, 0, G.settings.mapW, G.settings.mapH);
    this.cameras.main.setZoom(1);
    this.cameras.main.centerOn(G.settings.mapW / 2, G.settings.mapH / 2);

    // Background stars
    this._starGfx = this.add.graphics();
    drawStars(this._starGfx);

    // Nebula overlay
    this._nebulaGfx = this.add.graphics();
    drawNebula(this._nebulaGfx);

    // Territory layer
    this._terrGfx = this.add.graphics();

    // Hyperlane layer
    this._hlGfx = this.add.graphics();

    // Planet container
    this._planetContainer = this.add.container(0, 0);

    // Fleet layer (above planets)
    this._fleetGfx = this.add.graphics();

    // Selection ring
    this._selGfx = this.add.graphics();

    // HUD (fixed - doesn't move with camera)
    this._hudGfx = this.add.graphics().setScrollFactor(0);

    // Controls
    this.input.on('pointerdown', onPointerDown, this);
    this.input.on('pointermove', onPointerMove, this);
    this.input.on('wheel', onWheel, this);
    this._drag = false; this._lx = 0; this._ly = 0;

    // Initial render
    if (G) this.onStateUpdate();

    // Minimap click
    document.getElementById('minimap').onclick = e => {
      const r = e.currentTarget.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      this.cameras.main.centerOn(px * G.settings.mapW, py * G.settings.mapH);
      this.updateMiniVP();
    };

    this.updateMiniVP = updateMiniVP.bind(this);
    this.onStateUpdate = onStateUpdate.bind(this);
    this.updateFleets = updateFleets.bind(this);
    this.updateCursor = () => {};
  }

  function update() {
    if (scene && G && Object.keys(G.fleets || {}).length > 0) {
      updateFleets.call(this, Date.now());
    }
  }

  // ── DRAW STARS ────────────────────────────────────────────────────────────
  function drawStars(gfx) {
    gfx.clear();
    const W2 = G.settings.mapW, H2 = G.settings.mapH;
    const count = Math.floor(W2 * H2 / 12000);
    for (let i = 0; i < count; i++) {
      const x = Math.random() * W2;
      const y = Math.random() * H2;
      const r = Math.random() * 1 + 0.3;
      const a = Math.random() * 0.6 + 0.2;
      gfx.fillStyle(0xffffff, a);
      gfx.fillCircle(x, y, r);
    }
  }

  function drawNebula(gfx) {
    gfx.clear();
    const W2 = G.settings.mapW, H2 = G.settings.mapH;
    // Soft nebula patches
    [[W2*0.2, H2*0.3, 0x213280, 0.12], [W2*0.8, H2*0.7, 0x641450, 0.1]].forEach(([nx,ny,col,a]) => {
      for (let r = 600; r > 0; r -= 60) {
        gfx.fillStyle(col, a * (1 - r/600));
        gfx.fillCircle(nx, ny, r);
      }
    });
  }

  // ── STATE UPDATE ──────────────────────────────────────────────────────────
  function onStateUpdate() {
    if (!G) return;
    drawTerritories.call(this);
    drawHyperlanes.call(this);
    drawPlanets.call(this);
    drawMinimap.call(this);
    drawSelection.call(this);
  }

  function drawTerritories() {
    const gfx = this._terrGfx;
    gfx.clear();
    if (!G.settings.showTerritories) return;
    Object.values(G.factions).forEach(f => {
      if (f.id === 'neutral') return;
      const col = Phaser.Display.Color.HexStringToColor(f.color).color;
      Object.values(G.planets).filter(p => p.owner === f.id).forEach(p => {
        for (let r = 260; r > 0; r -= 26) {
          gfx.fillStyle(col, 0.28 * (1 - r / 260));
          gfx.fillCircle(p.x, p.y, r);
        }
      });
    });
  }

  function drawHyperlanes() {
    const gfx = this._hlGfx;
    gfx.clear();
    if (!G.hyperlanes) return;
    G.hyperlanes.forEach(l => {
      const p1 = G.planets[l.from], p2 = G.planets[l.to];
      if (!p1 || !p2) return;
      const friendly = p1.owner === 'republic' && p2.owner === 'republic';
      const hostile  = (p1.owner === 'separatist' || p2.owner === 'separatist') && (p1.owner !== 'republic' && p2.owner !== 'republic');
      const col = friendly ? 0x2196f3 : hostile ? 0xe53935 : 0x445566;
      const alpha = { large: 0.5, medium: 0.3, small: 0.18, dashed: 0.12 }[l.type] || 0.2;
      const w     = { large: 4,   medium: 3,   small: 2,    dashed: 2    }[l.type] || 2;
      gfx.lineStyle(w, col, alpha);
      if (l.type === 'dashed') {
        // Draw dashes
        const dx = p2.x - p1.x, dy = p2.y - p1.y;
        const len = Math.sqrt(dx*dx+dy*dy);
        const nx = dx/len, ny = dy/len;
        const dashLen = 18, gapLen = 10;
        let d = 0;
        while (d < len) {
          const end = Math.min(d + dashLen, len);
          gfx.beginPath();
          gfx.moveTo(p1.x + nx*d, p1.y + ny*d);
          gfx.lineTo(p1.x + nx*end, p1.y + ny*end);
          gfx.strokePath();
          d += dashLen + gapLen;
        }
      } else {
        gfx.beginPath();
        gfx.moveTo(p1.x, p1.y);
        gfx.lineTo(p2.x, p2.y);
        gfx.strokePath();
      }
    });
  }

  function drawPlanets() {
    // Remove old
    this._planetContainer.removeAll(true);
    this._planets = {};

    if (!G.planets) return;
    Object.values(G.planets).forEach(p => {
      const f = G.factions[p.owner] || G.factions.neutral;
      const col = Phaser.Display.Color.HexStringToColor(f.color).color;

      const container = this.add.container(p.x, p.y);

      // Glow ring
      const ring = this.add.graphics();
      ring.lineStyle(2, col, 0.5);
      ring.strokeCircle(0, 0, 36);
      // Inner glow
      ring.fillStyle(col, 0.05);
      ring.fillCircle(0, 0, 34);
      container.add(ring);

      // Planet sphere
      const sphere = this.add.graphics();
      const sphereColor = {
        city: 0x2d3a50, industrial: 0x6b4010, ocean: 0x1565c0,
        ice: 0x7aaccc, desert: 0xc47a15, forest: 0x2e7d32, volcanic: 0x7a1408
      }[p.type] || 0x444466;
      sphere.fillStyle(sphereColor, 1);
      sphere.fillCircle(0, 0, 28);
      // Shading
      sphere.fillStyle(0x000000, 0.5);
      sphere.fillEllipse(10, 8, 20, 20);
      sphere.fillStyle(0xffffff, 0.07);
      sphere.fillEllipse(-8, -8, 14, 14);
      container.add(sphere);

      // Planet name
      const nameText = this.add.text(0, 38, p.name.toUpperCase(), {
        fontFamily: 'Rajdhani', fontSize: '11px', fontStyle: 'bold',
        color: f.color, align: 'center',
        stroke: '#000000', strokeThickness: 3
      }).setOrigin(0.5, 0);
      container.add(nameText);

      // Fleet badges
      const sf = p.spaceFleets.filter(x => x).length;
      const gf = p.groundFleets.filter(x => x).length;
      if (sf > 0) {
        const badge = this.add.graphics();
        badge.fillStyle(0x0a0d14, 0.92);
        badge.fillRoundedRect(-8, -46, 26, 14, 3);
        badge.lineStyle(1, col, 0.8);
        badge.strokeRoundedRect(-8, -46, 26, 14, 3);
        const bt = this.add.text(2, -43, `🚀${sf}`, { fontFamily: 'Rajdhani', fontSize: '9px', color: f.color });
        container.add([badge, bt]);
      }
      if (gf > 0) {
        const badge2 = this.add.graphics();
        badge2.fillStyle(0x0a0d14, 0.92);
        badge2.fillRoundedRect(-22, 32, 26, 14, 3);
        badge2.lineStyle(1, col, 0.8);
        badge2.strokeRoundedRect(-22, 32, 26, 14, 3);
        const bt2 = this.add.text(-12, 35, `⚔️${gf}`, { fontFamily: 'Rajdhani', fontSize: '9px', color: f.color });
        container.add([badge2, bt2]);
      }

      // Interaction
      const hitArea = this.add.graphics();
      hitArea.fillStyle(0xffffff, 0);
      hitArea.fillCircle(0, 0, 40);
      hitArea.setInteractive(new Phaser.Geom.Circle(0, 0, 40), Phaser.Geom.Circle.Contains);
      hitArea.on('pointerover', () => { container.setScale(1.1); showTooltip(p); });
      hitArea.on('pointerout',  () => { container.setScale(1.0); hideTooltip(); });
      hitArea.on('pointerdown', () => A.selectPlanet(p.id));
      container.add(hitArea);

      this._planetContainer.add(container);
      this._planets[p.id] = container;
    });
  }

  function drawSelection() {
    const gfx = this._selGfx;
    gfx.clear();
    if (!A.selectedPlanet || !G.planets[A.selectedPlanet]) return;
    const p = G.planets[A.selectedPlanet];
    gfx.lineStyle(2, 0xffb300, 0.9);
    gfx.strokeCircle(p.x, p.y, 38);
    gfx.lineStyle(1, 0xffb300, 0.4);
    gfx.strokeCircle(p.x, p.y, 48);
  }

  // ── FLEET ANIMATIONS ──────────────────────────────────────────────────────
  function updateFleets(ts) {
    const gfx = this._fleetGfx;
    gfx.clear();
    const now = ts || Date.now();

    Object.values(G.fleets || {}).forEach(t => {
      const seg = t.path?.[0];
      if (!seg) return;
      const p1 = G.planets[t.curFrom || seg.from];
      const p2 = G.planets[seg.to];
      if (!p1 || !p2) return;

      const elapsed = now - (t.segStart || now);
      const progress = Math.min(1, elapsed / (seg.dur || 5000));
      const x = p1.x + (p2.x - p1.x) * progress;
      const y = p1.y + (p2.y - p1.y) * progress;

      const f = G.factions[t.fleet?.faction] || G.factions.republic;
      const col = Phaser.Display.Color.HexStringToColor(f.color).color;

      // Total progress
      const totalPct = Math.min(1, (now - (t.start || now)) / (t.totalMs || 10000));

      // Glow
      gfx.fillStyle(col, 0.12);
      gfx.fillCircle(x, y, 22);

      // Circle
      gfx.lineStyle(2, col, 0.9);
      gfx.strokeCircle(x, y, 14);
      gfx.fillStyle(0x060810, 0.85);
      gfx.fillCircle(x, y, 13);

      // Progress arc
      gfx.lineStyle(2, col, 0.7);
      gfx.beginPath();
      gfx.arc(x, y, 18, -Math.PI / 2, -Math.PI / 2 + totalPct * Math.PI * 2, false, 0.05);
      gfx.strokePath();

      // Faction icon
      // (text drawn separately for performance)
    });

    // Draw fleet text labels separately
    // (handled by Phaser Text objects in a future iteration)
  }

  // ── MINIMAP ───────────────────────────────────────────────────────────────
  function drawMinimap() {
    const mmc = document.getElementById('mmc');
    mmc.querySelectorAll('.mp').forEach(e => e.remove());
    if (!G.planets) return;
    Object.values(G.planets).forEach(p => {
      const f = G.factions[p.owner] || G.factions.neutral;
      const d = document.createElement('div');
      d.className = 'mp';
      d.style.cssText = `left:${(p.x / G.settings.mapW * 100)}%;top:${(p.y / G.settings.mapH * 100)}%;background:${f.color}`;
      mmc.appendChild(d);
    });
    updateMiniVP.call(this);
  }

  function updateMiniVP() {
    const cam = this.cameras.main;
    const mm  = document.getElementById('minimap');
    const mv  = document.getElementById('mvp');
    const W2  = G.settings.mapW, H2 = G.settings.mapH;
    const sx  = mm.clientWidth / W2, sy = mm.clientHeight / H2;
    const vw  = this.scale.width / cam.zoom;
    const vh  = this.scale.height / cam.zoom;
    mv.style.width  = vw * sx + 'px';
    mv.style.height = vh * sy + 'px';
    mv.style.left   = (cam.scrollX) * sx + 'px';
    mv.style.top    = (cam.scrollY) * sy + 'px';
    document.getElementById('zlv').textContent = Math.round(cam.zoom * 100) + '%';
  }

  // ── INPUT ─────────────────────────────────────────────────────────────────
  function onPointerDown(ptr) {
    if (ptr.rightButtonDown()) return;
    this._drag = true; this._lx = ptr.x; this._ly = ptr.y;
    this._moved = false;
  }

  function onPointerMove(ptr) {
    if (!this._drag) {
      document.getElementById('coords').textContent =
        `X: ${Math.round(ptr.worldX)} | Y: ${Math.round(ptr.worldY)}`;
      return;
    }
    const dx = ptr.x - this._lx, dy = ptr.y - this._ly;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) this._moved = true;
    this.cameras.main.scrollX -= dx / this.cameras.main.zoom;
    this.cameras.main.scrollY -= dy / this.cameras.main.zoom;
    this._lx = ptr.x; this._ly = ptr.y;
    updateMiniVP.call(this);
  }

  function onWheel(ptr, gameObjs, dx, dy) {
    const cam = this.cameras.main;
    const wx = ptr.worldX, wy = ptr.worldY;
    const oldZoom = cam.zoom;
    const newZoom = Phaser.Math.Clamp(oldZoom - dy * 0.001, 0.2, 3);
    cam.zoom = newZoom;
    // Zoom towards cursor
    cam.scrollX += wx - (wx - cam.scrollX) * (oldZoom / newZoom);
    cam.scrollY += wy - (wy - cam.scrollY) * (oldZoom / newZoom);
    updateMiniVP.call(this);
    document.getElementById('zlv').textContent = Math.round(newZoom * 100) + '%';
  }

  // ── TOOLTIP ───────────────────────────────────────────────────────────────
  let _ttTimeout;
  function showTooltip(p) {
    clearTimeout(_ttTimeout);
    // Use a simple CSS tooltip
  }
  function hideTooltip() { clearTimeout(_ttTimeout); }

  // Ctrl+click for new planet
  document.getElementById('game-wrap').addEventListener('click', e => {
    if (!e.ctrlKey || !scene) return;
    const cam   = scene.cameras.main;
    const rect  = e.currentTarget.getBoundingClientRect();
    const wx    = Math.round((e.clientX - rect.left) / cam.zoom + cam.scrollX);
    const wy    = Math.round((e.clientY - rect.top)  / cam.zoom + cam.scrollY);
    const name  = prompt('Nom de la nouvelle planète:');
    if (!name) return;
    socket.emit('add_planet', { name, x: wx, y: wy, type: 'desert', owner: 'neutral', bonus: 100 }, r => {
      if (r.ok) toast(`✓ ${name} créée!`, 'ok');
    });
  });

  window.addEventListener('resize', () => {
    game.scale.resize(window.innerWidth - 340, window.innerHeight);
  });
}
</script>
