<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Republic at War — Carte Galactique</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060810;--surf:rgba(9,13,26,.95);--rep:#2196f3;--sep:#e53935;--gold:#ffb300;--ok:#43a047;--t1:#e8edf4;--t2:#8fa3b8;--t3:#3d5466;--b1:rgba(255,255,255,.07);--r:4px;--r2:8px}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--t1);overflow:hidden;width:100vw;height:100vh}
#game-canvas{position:fixed;top:0;left:0}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;height:48px;background:linear-gradient(180deg,rgba(6,8,16,.98),rgba(6,8,16,.8));border-bottom:1px solid var(--b1);display:flex;align-items:center;z-index:100;backdrop-filter:blur(12px)}
#hdr-brand{display:flex;align-items:center;gap:9px;padding:0 16px;border-right:1px solid var(--b1);height:100%}
.fcrest{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:.85rem;overflow:hidden;background:rgba(0,0,0,.4)}
#hdr-title{font-family:'Cinzel Decorative',serif;font-size:.55rem;color:var(--gold);letter-spacing:2px}
#hdr-sub{font-size:.42rem;color:var(--t3);letter-spacing:3px;text-transform:uppercase}
#hdr-res{display:flex;align-items:center;flex:1;padding:0 8px}
.hres{display:flex;align-items:center;gap:6px;padding:0 10px;height:48px;border-right:1px solid var(--b1,rgba(255,255,255,.07))}
.hres-val{font-family:'JetBrains Mono';font-size:.72rem;font-weight:700;color:var(--gold)}
.hres-val.b{color:var(--rep)}.hres-val.r{color:var(--sep)}
.hres-lbl{font-size:.4rem;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px}
#conn{display:flex;align-items:center;gap:6px;padding:0 12px}
.dot{width:7px;height:7px;border-radius:50%;background:#607d8b;transition:background .3s}
.dot.on{background:var(--ok)}.dot.err{background:var(--sep)}
#badge{position:fixed;top:58px;left:10px;background:var(--surf);border:1px solid var(--b1);padding:4px 9px;font-size:.46rem;color:var(--t3);border-radius:var(--r);z-index:80;letter-spacing:1.5px;text-transform:uppercase}

/* DETAIL PANEL */
#panel{position:fixed;top:48px;right:0;width:310px;height:calc(100vh - 48px);background:var(--surf);border-left:1px solid var(--b1);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:80;display:flex;flex-direction:column;overflow-y:auto}
#panel.open{transform:translateX(0)}
#panel-close{position:absolute;top:8px;right:10px;background:none;border:1px solid var(--b1);color:var(--t3);width:24px;height:24px;cursor:pointer;border-radius:var(--r);font-size:.8rem;z-index:10}
#prv{height:130px;background:linear-gradient(180deg,#111827,#0b1120);display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--b1);flex-shrink:0}
#prv-sp{width:80px;height:80px;border-radius:50%;box-shadow:inset -16px -12px 32px rgba(0,0,0,.85)}
#prv-info{position:absolute;bottom:8px;left:12px;right:12px}
#prv-name{font-family:'Cinzel Decorative',serif;font-size:.75rem;color:var(--gold)}
#prv-sub{font-size:.54rem;color:var(--t2);margin-top:2px}
.sec{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.sec-t{font-size:.44rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:2px;margin-bottom:5px}
.fslot{background:rgba(255,255,255,.03);border:1px solid var(--b1);padding:6px 8px;margin-bottom:3px;border-radius:var(--r)}
.fsname{font-size:.58rem;color:var(--gold);font-weight:600;margin-bottom:2px}
.fsfac{font-size:.42rem}
.futs{display:flex;flex-wrap:wrap;gap:2px}
.utag{font-size:.42rem;padding:1px 4px;border-radius:3px;background:rgba(33,150,243,.15);border:1px solid rgba(33,150,243,.3);color:var(--rep)}
.empty-slot{color:var(--t3);font-size:.5rem;font-style:italic}
.bslot{background:rgba(255,255,255,.03);border:1px solid var(--b1);padding:5px 8px;margin-bottom:3px;border-radius:var(--r);display:flex;align-items:center;gap:6px}
.bslot.empty{color:var(--t3);font-size:.5rem;font-style:italic}
.bname{font-size:.56rem}.bbonus{font-size:.42rem;color:var(--gold)}

/* HUD */
#minimap{position:fixed;bottom:14px;left:14px;width:148px;height:98px;background:var(--surf);border:1px solid var(--b1);border-radius:var(--r2);z-index:80;overflow:hidden;cursor:pointer}
#mmc{position:relative;width:100%;height:100%}
.mp{position:absolute;width:4px;height:4px;border-radius:50%;transform:translate(-50%,-50%)}
#mvp{position:absolute;border:1px solid var(--gold);background:rgba(255,179,0,.08);pointer-events:none}
#coords{position:fixed;bottom:120px;left:14px;padding:4px 8px;background:var(--surf);border:1px solid var(--b1);font-family:'JetBrains Mono';font-size:.48rem;color:var(--t3);border-radius:var(--r)}
#zctrl{position:fixed;bottom:14px;left:178px;display:flex;flex-direction:column;gap:4px}
.zbtn{width:30px;height:30px;background:var(--surf);border:1px solid var(--b1);color:var(--t1);font-size:.95rem;cursor:pointer;border-radius:var(--r);display:flex;align-items:center;justify-content:center;transition:all .15s}
.zbtn:hover{border-color:var(--rep);color:var(--rep)}
.zlv{text-align:center;font-family:'JetBrains Mono';font-size:.48rem;color:var(--t3);padding:3px;background:var(--surf);border:1px solid var(--b1);border-radius:var(--r)}

/* EVENT LOG */
#evlog{position:fixed;top:58px;left:0;width:255px;max-height:220px;background:var(--surf);border:1px solid var(--b1);border-radius:0 0 var(--r2) 0;z-index:78;overflow:hidden}
#evlog-hdr{padding:4px 9px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--b1);font-size:.42rem;color:var(--t3);text-transform:uppercase;letter-spacing:2px}
#evlog-list{max-height:188px;overflow-y:auto}
.ev{padding:4px 9px;border-bottom:1px solid rgba(255,255,255,.03);font-size:.48rem;line-height:1.4}
.ev.battle{color:#ef9a9a}.ev.conquest{color:#a5d6a7}.ev.build{color:var(--gold)}.ev.move{color:var(--rep)}.ev.announce{color:#fff;font-weight:700;font-size:.52rem}

/* ANNOUNCE BANNER */
#announce-banner{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(255,179,0,.95);color:#000;padding:10px 24px;border-radius:var(--r);font-family:'Cinzel Decorative',serif;font-size:.72rem;font-weight:700;letter-spacing:2px;z-index:200;display:none;box-shadow:0 4px 20px rgba(255,179,0,.4)}
#announce-banner.on{display:block;animation:ban 5s ease forwards}
@keyframes ban{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}

/* COMBAT BANNER */
#combat-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(6,8,16,.97);border:2px solid var(--sep);border-radius:var(--r2);padding:20px 30px;text-align:center;z-index:300;display:none;min-width:300px;box-shadow:0 0 40px rgba(229,57,53,.3)}
#combat-banner.on{display:block;animation:cbsh .4s ease}
@keyframes cbsh{0%{transform:translate(-50%,-50%) scale(.9)}100%{transform:translate(-50%,-50%) scale(1)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- HEADER -->
<header id="hdr">
  <div id="hdr-brand">
    <div class="fcrest" id="fcrest">⚙</div>
    <div><div id="hdr-title">REPUBLIC AT WAR</div><div id="hdr-sub">Carte Galactique</div></div>
  </div>
  <div id="hdr-res">
    <div class="hres"><span style="font-size:.85rem">🌍</span><div><div class="hres-val b" id="r-rep">—</div><div class="hres-lbl">République</div></div></div>
    <div class="hres"><span style="font-size:.85rem">🌍</span><div><div class="hres-val r" id="r-sep">—</div><div class="hres-lbl">Séparatistes</div></div></div>
    <div class="hres"><span style="font-size:.85rem">🚀</span><div><div class="hres-val" id="r-tr">0</div><div class="hres-lbl">En transit</div></div></div>
  </div>
  <div id="conn"><div class="dot" id="conn-dot"></div><span style="font-size:.48rem;color:var(--t3)" id="conn-txt">Connexion...</span></div>
</header>

<div id="badge">👁 Mode Visualisation</div>

<!-- PLANET DETAIL -->
<div id="panel">
  <button id="panel-close" onclick="closePanel()">✕</button>
  <div id="prv"><div id="prv-sp"></div><div id="prv-info"><div id="prv-name">PLANÈTE</div><div id="prv-sub"></div></div></div>
  <div class="sec"><div class="sec-t">🚀 Flottes Spatiales</div><div id="sf-cont"></div></div>
  <div class="sec"><div class="sec-t">⚔️ Armées Terrestres</div><div id="gf-cont"></div></div>
  <div class="sec"><div class="sec-t">🛰️ Structures Orbitales</div><div id="sb-cont"></div></div>
  <div class="sec"><div class="sec-t">🏛️ Structures au Sol</div><div id="gb-cont"></div></div>
</div>

<!-- HUD -->
<div id="minimap"><div id="mmc"><div id="mvp"></div></div></div>
<div id="coords">X: 0 | Y: 0</div>
<div id="zctrl">
  <button class="zbtn" onclick="V.zi()">+</button>
  <div class="zlv" id="zlv">100%</div>
  <button class="zbtn" onclick="V.zo()">−</button>
  <button class="zbtn" onclick="V.rv()" style="font-size:.6rem">⌂</button>
</div>

<!-- EVENT LOG -->
<div id="evlog"><div id="evlog-hdr">Journal des événements</div><div id="evlog-list"></div></div>

<!-- BANNERS -->
<div id="announce-banner"></div>
<div id="combat-banner">
  <div id="cb-title" style="font-family:'Cinzel Decorative',serif;font-size:.9rem;color:var(--gold);margin-bottom:10px">⚔️ COMBAT</div>
  <div id="cb-body" style="font-size:.65rem;color:var(--t1);line-height:1.8"></div>
  <button onclick="document.getElementById('combat-banner').classList.remove('on')" style="margin-top:12px;padding:5px 16px;background:none;border:1px solid var(--b1);color:var(--t2);cursor:pointer;border-radius:4px;font-family:'Rajdhani';font-size:.58rem">Fermer</button>
</div>

<script>
'use strict';

const socket = io();
let G = null;
let scene = null;
let selectedPlanet = null;

const ic = (o, s=16) => o?.image
  ? `<img src="${o.image}" style="width:${s}px;height:${s}px;border-radius:3px;object-fit:cover">`
  : `<span style="font-size:${Math.round(s*.75)}px;line-height:1">${o?.icon||'?'}</span>`;
const fmt = n => Math.floor(n).toLocaleString('fr-FR');

// ─── SOCKET ───────────────────────────────────────────────────────────────────
socket.on('connect', () => {
  document.getElementById('conn-dot').classList.add('on');
  document.getElementById('conn-txt').textContent = 'Connecté';
});
socket.on('disconnect', () => {
  document.getElementById('conn-dot').className = 'dot err';
  document.getElementById('conn-txt').textContent = 'Déconnecté';
});
socket.on('state', s => {
  G = s;
  if (!scene) initPhaser();
  else scene.onStateUpdate();
  updateHUD();
});
socket.on('state_delta', delta => {
  if (!G) return;
  Object.assign(G, delta);
  if (scene) scene.onStateUpdate();
  updateHUD();
  if (selectedPlanet) openPanel(selectedPlanet);
});
socket.on('fleets_tick', ({ fleets, ts }) => {
  if (!G) return;
  G.fleets = fleets;
  if (scene) scene.updateFleets(ts);
});
socket.on('credits', credits => {
  if (!G) return;
  G.credits = credits;
  updateHUD();
});
socket.on('announce', ({ msg }) => {
  const b = document.getElementById('announce-banner');
  b.textContent = '📢 ' + msg;
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
});
socket.on('combat_result', ({ result, planet }) => {
  const cb = document.getElementById('combat-banner');
  const title = document.getElementById('cb-title');
  const body  = document.getElementById('cb-body');
  title.textContent = result.won ? (result.captured ? '🏆 CONQUÊTE' : '⚔️ VICTOIRE') : '💀 DÉFAITE';
  title.style.color = result.won ? '#a5d6a7' : '#ef9a9a';
  body.innerHTML = `
    <div>Planète: <strong style="color:var(--gold)">${planet.name}</strong></div>
    <div>Attaquant: <span style="color:${G.factions[result.attacker]?.color||'#fff'}">${G.factions[result.attacker]?.name||result.attacker}</span></div>
    <div>Défenseur: <span style="color:${G.factions[result.defender]?.color||'#fff'}">${G.factions[result.defender]?.name||result.defender}</span></div>
    <div style="margin-top:8px;padding:8px;background:rgba(255,255,255,.05);border-radius:4px">
      ⚔️ Attaque: <strong>${result.atkPow}</strong> vs Défense: <strong>${result.defPow}</strong>
    </div>
    ${result.captured ? `<div style="margin-top:8px;color:#a5d6a7;font-weight:700">La planète change de mains!</div>` : ''}
  `;
  cb.classList.add('on');
  setTimeout(() => cb.classList.remove('on'), 8000);
});

// ─── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD() {
  if (!G) return;
  const total = Object.keys(G.planets || {}).length;
  const rep   = Object.values(G.planets || {}).filter(p => p.owner === 'republic').length;
  const sep   = Object.values(G.planets || {}).filter(p => p.owner === 'separatist').length;
  document.getElementById('r-rep').textContent = `${rep} / ${total}`;
  document.getElementById('r-sep').textContent = `${sep} / ${total}`;
  document.getElementById('r-tr').textContent  = Object.keys(G.fleets || {}).length;

  const log = document.getElementById('evlog-list');
  if (log && G.eventLog) {
    log.innerHTML = G.eventLog.slice(0, 25).map(e =>
      `<div class="ev ${e.type}">${e.msg}</div>`
    ).join('');
  }
}

// ─── PANEL ────────────────────────────────────────────────────────────────────
function openPanel(pid) {
  selectedPlanet = pid;
  const p = G.planets[pid];
  if (!p) return;
  const f = G.factions[p.owner] || G.factions.neutral;

  const sp = document.getElementById('prv-sp');
  sp.className = 'psp ' + p.type;
  sp.style.backgroundImage = p.image ? `url(${p.image})` : '';

  document.getElementById('prv-name').textContent = p.name.toUpperCase();
  document.getElementById('prv-sub').innerHTML = `${p.terrain||''} • <span style="color:${f.color}">${f.name}</span>`;

  const rf = arr => arr.map((fl, i) => {
    if (!fl) return `<div class="fslot"><div class="empty-slot">Slot ${i+1} — Vide</div></div>`;
    const ff = G.factions[fl.faction] || f;
    let us = '';
    for (const uid in fl.units||{}) {
      if (!(fl.units[uid]>0)) continue;
      const u = G.unitTypes[uid];
      if (u) us += `<span class="utag">${fl.units[uid]}×${u.name}</span>`;
    }
    return `<div class="fslot" style="border-left:3px solid ${ff.color}">
      <div class="fsname">${ic(fl,15)} ${fl.name}</div>
      <div class="fsfac" style="color:${ff.color}">${ff.name}</div>
      <div class="futs">${us||'<span style="font-size:.42rem;color:var(--t3)">Aucune unité</span>'}</div>
    </div>`;
  }).join('');

  const rb = arr => arr.map((b, i) => {
    if (!b) return `<div class="bslot empty">Slot ${i+1} — Vide</div>`;
    const bt = G.buildingTypes[b.type];
    return `<div class="bslot"><span>${bt ? ic(bt,15) : '🏛️'}</span><div><div class="bname">${b.name||bt?.name||'?'}</div>${bt?`<div class="bbonus">${bt.bonus||''}</div>`:''}</div></div>`;
  }).join('');

  document.getElementById('sf-cont').innerHTML = rf(p.spaceFleets);
  document.getElementById('gf-cont').innerHTML = rf(p.groundFleets);
  document.getElementById('sb-cont').innerHTML = rb(p.spaceBuildings);
  document.getElementById('gb-cont').innerHTML = rb(p.groundBuildings);

  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  selectedPlanet = null;
  document.getElementById('panel').classList.remove('open');
}

// ─── VIEWER CONTROLLER ───────────────────────────────────────────────────────
const V = {
  zi() { scene?.cameras.main.zoom = Math.min(3, scene.cameras.main.zoom + 0.15); scene?.updateMiniVP(); },
  zo() { scene?.cameras.main.zoom = Math.max(0.2, scene.cameras.main.zoom - 0.15); scene?.updateMiniVP(); },
  rv() { scene?.cameras.main.zoom = 1; scene?.cameras.main.centerOn(G.settings.mapW / 2, G.settings.mapH / 2); scene?.updateMiniVP(); }
};

// ─── PHASER 3 ────────────────────────────────────────────────────────────────
function initPhaser() {
  const game = new Phaser.Game({
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    canvas: document.getElementById('game-canvas'),
    backgroundColor: '#060810',
    scene: { preload: () => {}, create, update }
  });

  function create() {
    scene = this;
    this.cameras.main.setBounds(0, 0, G.settings.mapW, G.settings.mapH);
    this.cameras.main.setZoom(1);
    this.cameras.main.centerOn(G.settings.mapW / 2, G.settings.mapH / 2);

    // Layers
    this._starGfx    = this.add.graphics();
    this._nebulaGfx  = this.add.graphics();
    this._terrGfx    = this.add.graphics();
    this._hlGfx      = this.add.graphics();
    this._planetCont = this.add.container(0, 0);
    this._fleetGfx   = this.add.graphics();
    this._selGfx     = this.add.graphics();

    drawStars(this._starGfx);
    drawNebula(this._nebulaGfx);

    this.input.on('pointerdown', (ptr) => { this._drag=true; this._lx=ptr.x; this._ly=ptr.y; this._moved=false; });
    this.input.on('pointermove', (ptr) => {
      document.getElementById('coords').textContent = `X: ${Math.round(ptr.worldX)} | Y: ${Math.round(ptr.worldY)}`;
      if (!this._drag) return;
      const dx=ptr.x-this._lx, dy=ptr.y-this._ly;
      if (Math.abs(dx)>3||Math.abs(dy)>3) this._moved=true;
      this.cameras.main.scrollX -= dx/this.cameras.main.zoom;
      this.cameras.main.scrollY -= dy/this.cameras.main.zoom;
      this._lx=ptr.x; this._ly=ptr.y;
      updateMiniVP.call(this);
    });
    this.input.on('pointerup', () => { this._drag=false; });
    this.input.on('wheel', (ptr,g,dx,dy) => {
      const cam=this.cameras.main, wx=ptr.worldX, wy=ptr.worldY;
      const oz=cam.zoom, nz=Phaser.Math.Clamp(oz-dy*.001,.2,3);
      cam.zoom=nz;
      cam.scrollX += wx-(wx-cam.scrollX)*(oz/nz);
      cam.scrollY += wy-(wy-cam.scrollY)*(oz/nz);
      updateMiniVP.call(this);
      document.getElementById('zlv').textContent=Math.round(nz*100)+'%';
    });

    document.getElementById('minimap').onclick = e => {
      const r=e.currentTarget.getBoundingClientRect();
      this.cameras.main.centerOn((e.clientX-r.left)/r.width*G.settings.mapW,(e.clientY-r.top)/r.height*G.settings.mapH);
      updateMiniVP.call(this);
    };

    this.updateMiniVP = updateMiniVP.bind(this);
    this.onStateUpdate = onStateUpdate.bind(this);
    this.updateFleets  = updateFleets.bind(this);
    this.onStateUpdate();

    window.addEventListener('resize', () => game.scale.resize(window.innerWidth, window.innerHeight));
  }

  function update() {
    if (scene && G && Object.keys(G.fleets||{}).length>0) updateFleets.call(this, Date.now());
  }

  function drawStars(gfx) {
    gfx.clear();
    const cnt=Math.floor(G.settings.mapW*G.settings.mapH/12000);
    for (let i=0;i<cnt;i++) {
      const x=Math.random()*G.settings.mapW, y=Math.random()*G.settings.mapH;
      gfx.fillStyle(0xffffff, Math.random()*.6+.2);
      gfx.fillCircle(x,y,Math.random()*1+.3);
    }
  }

  function drawNebula(gfx) {
    gfx.clear();
    [[G.settings.mapW*.2,G.settings.mapH*.3,0x213280,.1],[G.settings.mapW*.8,G.settings.mapH*.7,0x641450,.08]].forEach(([nx,ny,col,a])=>{
      for (let r=500;r>0;r-=50){gfx.fillStyle(col,a*(1-r/500));gfx.fillCircle(nx,ny,r);}
    });
  }

  function onStateUpdate() {
    drawTerritories.call(this);
    drawHyperlanes.call(this);
    drawPlanets.call(this);
    drawMinimap.call(this);
    drawSelection.call(this);
    updateHUD();
  }

  function drawTerritories() {
    const gfx=this._terrGfx; gfx.clear();
    if (!G.settings.showTerritories) return;
    Object.values(G.factions).forEach(f=>{
      if (f.id==='neutral') return;
      const col=Phaser.Display.Color.HexStringToColor(f.color).color;
      Object.values(G.planets).filter(p=>p.owner===f.id).forEach(p=>{
        for (let r=250;r>0;r-=25){gfx.fillStyle(col,.25*(1-r/250));gfx.fillCircle(p.x,p.y,r);}
      });
    });
  }

  function drawHyperlanes() {
    const gfx=this._hlGfx; gfx.clear();
    G.hyperlanes?.forEach(l=>{
      const p1=G.planets[l.from],p2=G.planets[l.to]; if (!p1||!p2) return;
      const friendly=p1.owner==='republic'&&p2.owner==='republic';
      const col=friendly?0x2196f3:0x445566;
      const alpha={large:.45,medium:.28,small:.16,dashed:.1}[l.type]||.2;
      const w={large:4,medium:3,small:2,dashed:2}[l.type]||2;
      gfx.lineStyle(w,col,alpha);
      if (l.type==='dashed') {
        const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.sqrt(dx*dx+dy*dy),nx=dx/len,ny=dy/len;
        let d=0; while(d<len){const end=Math.min(d+16,len);gfx.beginPath();gfx.moveTo(p1.x+nx*d,p1.y+ny*d);gfx.lineTo(p1.x+nx*end,p1.y+ny*end);gfx.strokePath();d+=24;}
      } else {
        gfx.beginPath();gfx.moveTo(p1.x,p1.y);gfx.lineTo(p2.x,p2.y);gfx.strokePath();
      }
    });
  }

  function drawPlanets() {
    this._planetCont.removeAll(true);
    if (!G.planets) return;
    Object.values(G.planets).forEach(p=>{
      const f=G.factions[p.owner]||G.factions.neutral;
      const col=Phaser.Display.Color.HexStringToColor(f.color).color;
      const cont=this.add.container(p.x,p.y);

      const ring=this.add.graphics();
      ring.lineStyle(2,col,.45); ring.strokeCircle(0,0,34);
      ring.fillStyle(col,.04); ring.fillCircle(0,0,33);
      cont.add(ring);

      const sphere=this.add.graphics();
      const sc={city:0x2d3a50,industrial:0x6b4010,ocean:0x1565c0,ice:0x7aaccc,desert:0xc47a15,forest:0x2e7d32,volcanic:0x7a1408}[p.type]||0x444466;
      sphere.fillStyle(sc,1); sphere.fillCircle(0,0,26);
      sphere.fillStyle(0x000000,.45); sphere.fillEllipse(9,7,18,18);
      sphere.fillStyle(0xffffff,.06); sphere.fillEllipse(-7,-7,12,12);
      cont.add(sphere);

      const nt=this.add.text(0,34,p.name.toUpperCase(),{fontFamily:'Rajdhani',fontSize:'10px',fontStyle:'bold',color:f.color,align:'center',stroke:'#000000',strokeThickness:3}).setOrigin(.5,0);
      cont.add(nt);

      const sf=p.spaceFleets.filter(x=>x).length, gf=p.groundFleets.filter(x=>x).length;
      if (sf>0) {const bg=this.add.graphics();bg.fillStyle(0x0a0d14,.9);bg.fillRoundedRect(-7,-44,24,13,3);bg.lineStyle(1,col,.7);bg.strokeRoundedRect(-7,-44,24,13,3);cont.add([bg,this.add.text(3,-42,'🚀'+sf,{fontFamily:'Rajdhani',fontSize:'8px',color:f.color}).setOrigin(0,0)]);}
      if (gf>0) {const bg2=this.add.graphics();bg2.fillStyle(0x0a0d14,.9);bg2.fillRoundedRect(-20,30,24,13,3);bg2.lineStyle(1,col,.7);bg2.strokeRoundedRect(-20,30,24,13,3);cont.add([bg2,this.add.text(-10,32,'⚔️'+gf,{fontFamily:'Rajdhani',fontSize:'8px',color:f.color}).setOrigin(0,0)]);}

      const hit=this.add.graphics();
      hit.fillStyle(0xffffff,0); hit.fillCircle(0,0,38);
      hit.setInteractive(new Phaser.Geom.Circle(0,0,38),Phaser.Geom.Circle.Contains);
      hit.on('pointerover',()=>{cont.setScale(1.08);});
      hit.on('pointerout', ()=>{cont.setScale(1.0);});
      hit.on('pointerdown',()=>{ if (!this._moved) openPanel(p.id); });
      cont.add(hit);
      this._planetCont.add(cont);
    });
  }

  function drawMinimap() {
    const mmc=document.getElementById('mmc');
    mmc.querySelectorAll('.mp').forEach(e=>e.remove());
    Object.values(G.planets||{}).forEach(p=>{
      const f=G.factions[p.owner]||G.factions.neutral;
      const d=document.createElement('div');
      d.className='mp';
      d.style.cssText=`left:${p.x/G.settings.mapW*100}%;top:${p.y/G.settings.mapH*100}%;background:${f.color}`;
      mmc.appendChild(d);
    });
    updateMiniVP.call(this);
  }

  function drawSelection() {
    const gfx=this._selGfx; gfx.clear();
    if (!selectedPlanet||!G.planets[selectedPlanet]) return;
    const p=G.planets[selectedPlanet];
    gfx.lineStyle(2,0xffb300,.9); gfx.strokeCircle(p.x,p.y,36);
    gfx.lineStyle(1,0xffb300,.3); gfx.strokeCircle(p.x,p.y,46);
  }

  function updateFleets(ts) {
    const gfx=this._fleetGfx; gfx.clear();
    const now=ts||Date.now();
    Object.values(G.fleets||{}).forEach(t=>{
      const seg=t.path?.[0]; if (!seg) return;
      const p1=G.planets[t.curFrom||seg.from],p2=G.planets[seg.to]; if(!p1||!p2) return;
      const prog=Math.min(1,(now-(t.segStart||now))/(seg.dur||5000));
      const x=p1.x+(p2.x-p1.x)*prog, y=p1.y+(p2.y-p1.y)*prog;
      const f=G.factions[t.fleet?.faction]||G.factions.republic;
      const col=Phaser.Display.Color.HexStringToColor(f.color).color;
      const totalPct=Math.min(1,(now-(t.start||now))/(t.totalMs||10000));
      gfx.fillStyle(col,.1); gfx.fillCircle(x,y,20);
      gfx.lineStyle(2,col,.85); gfx.strokeCircle(x,y,12);
      gfx.fillStyle(0x060810,.85); gfx.fillCircle(x,y,11);
      gfx.lineStyle(2,col,.7);
      gfx.beginPath();
      gfx.arc(x,y,16,-Math.PI/2,-Math.PI/2+totalPct*Math.PI*2,false,.05);
      gfx.strokePath();
    });
  }

  function updateMiniVP() {
    const cam=this.cameras.main,mm=document.getElementById('minimap'),mv=document.getElementById('mvp');
    const sx=mm.clientWidth/G.settings.mapW,sy=mm.clientHeight/G.settings.mapH;
    mv.style.width=(this.scale.width/cam.zoom)*sx+'px';
    mv.style.height=(this.scale.height/cam.zoom)*sy+'px';
    mv.style.left=(cam.scrollX)*sx+'px';
    mv.style.top=(cam.scrollY)*sy+'px';
    document.getElementById('zlv').textContent=Math.round(cam.zoom*100)+'%';
  }
}
</script>
